    :root {
      --tl-bg: #ffffff;
      --tl-fg: #333333;
      --tl-muted: #8c8c8c;
      --tl-accent: #179cde;
    }
    html.tl-dark {
      --tl-bg: #12181f;
      --tl-fg: #dbe1e8;
      --tl-muted: #87919e;
      --tl-accent: #3aa3e8;
    }
    /* self-contained light skin, used to re-skin the cloned layer during the reveal */
    .tl-skin-light {
      --tl-bg: #ffffff; --tl-fg: #333333; --tl-muted: #8c8c8c; --tl-accent: #179cde;
    }
    html { background: var(--tl-bg); }
    body {
      background: var(--tl-bg);
      color: var(--tl-fg);
    }
    .tl_page_footer { color: var(--tl-muted); }
    .tl_page_footer_link { color: var(--tl-muted); }
    .tl_page_footer_org { color: var(--tl-muted); }
    .tl_page_footer_org a.tl_page_footer_link { color: inherit; }
    .tl_page_footer_org a.tl_page_footer_link:hover {
      color: var(--tl-accent);
      text-decoration: none;
    }

    /* Hero: "Satu Aplikasi Satu Harga Chat Platform [flag]" - "Harga" links
       to /pricing; the flag sits in thin brackets, DevDay [2026] style. */
    :root, .tl-skin-light {
      --tl-brand-text: #1d1d1f;
      --tl-chat: #8b3dff;
    }
    html.tl-dark {
      --tl-brand-text: #f5f5f7;
      --tl-chat: #a974ff;
    }
    .tl_main_page_container {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 0;
      padding: 0 16px 40px;
    }
    .tl_hero {
      text-align: center;
      padding: 72px 0 24px; /* room for the note above "Harga" */
    }
    .tl_hero_title {
      margin: 0;
      color: var(--tl-muted); /* connecting words; key words override below */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(26px, 6.5vw, 44px);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .tl_hero_brand { color: var(--tl-brand-text); }
    .tl_hero_chat { color: var(--tl-chat); }
    .tl_hero_tag { white-space: nowrap; }
    .tl_hero_bracket {
      color: var(--tl-brand-text);
      font-weight: 200;
    }
    .tl_hero_flag {
      display: inline-block;
      width: 0.8em;
      height: 0.58em;
      margin: 0 0.1em;
      vertical-align: 0.02em;
      /* thin edge so the white half doesn't vanish on a white page */
      filter: drop-shadow(0 0 0.4px rgba(0, 0, 0, 0.45))
              drop-shadow(0 0.5px 0.5px rgba(0, 0, 0, 0.15));
      transform-origin: 10% 60%;
      animation: tl-flag-wave 2.8s ease-in-out infinite;
    }
    @keyframes tl-flag-wave {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(3deg) translateY(-0.03em); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tl_hero_flag { animation: none; transform: rotate(-4deg); }
    }
    .tl_hero_price {
      position: relative;
      white-space: nowrap;
      color: var(--tl-accent); /* same blue as the Premium plan on /pricing */
      text-decoration: none;
      text-underline-offset: 0.14em;
    }
    .tl_hero_price:hover,
    .tl_hero_price:focus {
      color: var(--tl-accent);
      text-decoration: underline;
      text-decoration-thickness: 0.1em;
    }

    /* Handwritten note above "Harga", arrow pointing down at it */
    .tl_hero_note {
      position: absolute;
      left: 45%;
      bottom: 100%;
      margin-bottom: 2px;
      width: 240px;
      color: var(--tl-fg);
      letter-spacing: 0;
      text-align: left;
      pointer-events: none;
    }
    .tl_hero_note > span {
      display: block;
      padding-left: 44px;
      font-family: "Caveat", cursive;
