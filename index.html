    :root {
      --tl-bg: #ffffff;
      --tl-fg: #333333;
      --tl-muted: #8c8c8c;
      --tl-accent: #179cde;
    }
    html.tl-dark {
      --tl-bg: #12181f;
      --tl-fg: #dbe1e8;
      --tl-muted: #87919e;
      --tl-accent: #3aa3e8;
    }
    /* self-contained light skin, used to re-skin the cloned layer during the reveal */
    .tl-skin-light {
      --tl-bg: #ffffff; --tl-fg: #333333; --tl-muted: #8c8c8c; --tl-accent: #179cde;
    }
    html { background: var(--tl-bg); }
    body {
      background: var(--tl-bg);
      color: var(--tl-fg);
    }
    .tl_page_footer { color: var(--tl-muted); }
    .tl_page_footer_link { color: var(--tl-muted); }
    .tl_page_footer_org { color: var(--tl-muted); }
    .tl_page_footer_org a.tl_page_footer_link { color: inherit; }
    .tl_page_footer_org a.tl_page_footer_link:hover {
      color: var(--tl-accent);
      text-decoration: none;
    }

    /* Hero: one sentence, "Satu Aplikasi dengan Harga tetap untuk
       Chat^kebutuhan." - "Harga tetap" links to /pricing; "kebutuhan" is
       raised like an exponent on Chat. */
    :root, .tl-skin-light {
      --tl-brand-text: #1d1d1f;
      --tl-chat: #8b3dff;
    }
    html.tl-dark {
      --tl-brand-text: #f5f5f7;
      --tl-chat: #a974ff;
    }
    .tl_main_page_container {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 0;
      padding: 0 16px 40px;
    }
    .tl_hero {
      text-align: center;
      padding: 72px 0 24px; /* room for the note above "Harga tetap" */
    }
    .tl_hero_title {
      margin: 0;
      color: var(--tl-muted); /* connecting words; key words override below */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(26px, 6.5vw, 44px);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .tl_hero_brand { color: var(--tl-brand-text); }
    .tl_hero_chat { color: var(--tl-chat); font-style: italic; }
    .tl_hero_sup {
      margin-left: 0.25em; /* clear the slant of the italic "t" */
      font-size: 0.5em;
      font-style: normal;
      line-height: 0;
      vertical-align: 0.9em;
    }
    .tl_hero_price {
      position: relative;
      white-space: nowrap;
      color: var(--tl-accent); /* same blue as the Premium plan on /pricing */
    }
    .tl_hero_price:hover,
    .tl_hero_price:focus {
      color: var(--tl-accent);
      text-decoration: none;
    }

    /* Handwritten note above "Harga tetap", arrow pointing down at it */
    .tl_hero_note {
      position: absolute;
      left: 45%;
      bottom: 100%;
      margin-bottom: 2px;
      width: 150px;
      color: var(--tl-fg);
      letter-spacing: 0;
      text-align: left;
      pointer-events: none;
    }
    .tl_hero_note > span {
      display: block;
      padding-left: 44px;
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.05;
      transform: rotate(-4deg);
    }
    .tl_hero_note svg {
      display: block;
      width: 64px;
      height: 40px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tl_hero_note .tl_note_arrow_m,
    .tl_br_m { display: none; }
    /* Phones: break as "Satu Aplikasi dengan / Harga tetap / untuk
       Chat^kebutuhan." and put the note beside "Harga tetap" with a short
       arrow pointing left at it, so no gap opens up between the lines. */
    @media (max-width: 480px) {
      .tl_hero { padding-top: 24px; }
      .tl_hero_title { font-size: clamp(22px, 7vw, 30px); }
      .tl_br_m { display: inline; }
      /* reserve the note's width on the line so "Harga tetap" + note centre together */
      .tl_hero_price { margin-right: 86px; }
      .tl_hero_note {
        left: 100%;
        top: 50%;
        bottom: auto;
        width: auto;
        margin: 0 0 0 2px;
        display: flex;
        align-items: center;
        transform: translateY(-50%);
      }
      .tl_hero_note > span { font-size: 15px; padding-left: 2px; }
      .tl_hero_note .tl_note_arrow_d { display: none; }
      .tl_hero_note .tl_note_arrow_m { display: block; width: 22px; height: 16px; }
    }
  </style>
</head>
